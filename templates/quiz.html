<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="layout">

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-logo"></span>
                <span class="sidebar-title">UniTutor</span>
            </div>
            <nav class="sidebar-nav">
                <a href="{{ url_for('home') }}" class="nav-item">Home</a>
                <a href="{{ url_for('courses') }}" class="nav-item">Courses</a>
                <a href="{{ url_for('recorder') }}" class="nav-item">Audio Recorder</a>
                <a href="{{ url_for('prof_recordings') }}" class="nav-item">My Recordings</a>
                <a href="{{ url_for('quiz')}}" class="nav-item active">Quiz</a>
                <a href="#" class="nav-item">Settings</a>
                <a href="{{ url_for('login') }}" class="nav-item">Login</a>
            </nav>
        </aside>

        <div class="main">
            <div class="topbar">
                <button class="toggle-btn" onclick="toggleSidebar()">☰</button>
                <h1>Lecture Quiz</h1>
            </div>
            <div class="quiz-wrapper">
                <!-- Question view -->
                <div class="quiz-container" id="quiz-card">
                    <div class="quiz-header">
                        <small id="quiz-progress"></small>
                        <div class="quiz-progress-bar">
                            <div id="quiz-progress-fill"></div>
                        </div>
                        <h2 id="quiz-question">Loading…</h2>
                    </div>
                    <div class="quiz-answer-container" id="quiz-answers"></div>
                    <p id="quiz-explanation" class="quiz-explanation" hidden></p>
                </div>

                <div class="quiz-bttn-container" id="quiz-controls">
                    <button class="quiz-btn" id="quiz-prev">← Previous question</button>
                    <button class="quiz-btn primary" id="quiz-next">Next question →</button>
                    <button class="quiz-btn ghost" id="quiz-end">End quiz</button>
                </div>

                <!-- Result view -->
                <div class="quiz-container quiz-result" id="quiz-result" hidden>
                    <h2>Quiz complete</h2>
                    <p class="quiz-score" id="quiz-score"></p>
                    <p id="quiz-score-detail"></p>
                    <button class="quiz-btn primary" id="quiz-retake">Retake quiz</button>
                </div>
            </div>


        </div>
    </div>

    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
    <script src="{{ url_for('static', filename='js/quiz.js') }}?v=3"></script>
</body>

</html>
